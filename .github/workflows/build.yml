name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android NDK e SDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;24.0.8215888" "build-tools;33.0.2" "platforms;android-33" "platform-tools"

      - name: Extrair e configurar bibliotecas nativas (libogg e libtheora)
        run: |
          mkdir -p dependencies/android
          cd dependencies/android
          rm -rf libogg libtheora libogg-1.3.5 libtheora-1.1.1 libogg.tar.gz libtheora.tar.gz

          wget -q https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz -O libogg.tar.gz
          mkdir -p libogg
          tar -xzf libogg.tar.gz -C libogg --strip-components=1
          rm libogg.tar.gz

          wget -q https://downloads.xiph.org/releases/theora/libtheora-1.1.1.tar.gz -O libtheora.tar.gz
          mkdir -p libtheora
          tar -xzf libtheora.tar.gz -C libtheora --strip-components=1
          rm libtheora.tar.gz

          mkdir -p libogg/include/ogg
          cat << 'EOF' > libogg/include/ogg/config_types.h
          #ifndef __CONFIG_TYPES_H__
          #define __CONFIG_TYPES_H__

          #include <stdint.h>

          typedef int16_t ogg_int16_t;
          typedef uint16_t ogg_uint16_t;
          typedef int32_t ogg_int32_t;
          typedef uint32_t ogg_uint32_t;
          typedef int64_t ogg_int64_t;
          typedef uint64_t ogg_uint64_t;

          #endif
          EOF

      - name: Aplicar patches de compatibilidade Windows no código C++
        shell: python
        run: |
          import os

          win_compat_code = """#ifndef WIN_COMPAT_H
          #define WIN_COMPAT_H

          #ifndef _WIN32
          #include <stdint.h>
          #include <stdlib.h>
          #include <stdio.h>
          #include <string.h>
          #include <sys/stat.h>
          #include <unistd.h>
          #include <dlfcn.h>
          #include <string>

          #define __int8 char
          #define __int16 short
          #define __int32 int
          #define __int64 long long

          typedef uint32_t DWORD;
          typedef uint16_t WORD;
          typedef uint8_t BYTE;
          typedef void* HMODULE;
          typedef void* HANDLE;
          typedef void* HWND;
          typedef int HRESULT;
          typedef unsigned int UINT;
          typedef wchar_t WCHAR;
          typedef DWORD* PDWORD;

          #ifndef E_FAIL
          #define E_FAIL (-1)
          #endif
          #ifndef S_OK
          #define S_OK 0
          #endif
          #ifndef TEXT
          #define TEXT(quote) quote
          #endif

          #ifndef INVALID_FILE_ATTRIBUTES
          #define INVALID_FILE_ATTRIBUTES ((DWORD)-1)
          #endif
          #ifndef FILE_ATTRIBUTE_DIRECTORY
          #define FILE_ATTRIBUTE_DIRECTORY 0x10
          #endif
          #ifndef CP_UTF8
          #define CP_UTF8 65001
          #endif
          #ifndef _countof
          #define _countof(x) (sizeof(x)/sizeof((x)[0]))
          #endif

          #ifndef PAGE_EXECUTE_READWRITE
          #define PAGE_EXECUTE_READWRITE 0x40
          #endif
          #ifndef PAGE_READWRITE
          #define PAGE_READWRITE 0x04
          #endif

          #ifndef __fastcall
          #define __fastcall
          #endif
          #ifndef __cdecl
          #define __cdecl
          #endif
          #ifndef __stdcall
          #define __stdcall
          #endif

          #ifndef BASE_ADDRESS
          #define BASE_ADDRESS 0
          #endif
          #ifndef MAX_PATH
          #define MAX_PATH 260
          #endif

          #ifdef __cplusplus
          #include <utility>

          template <size_t N, typename... Args>
          inline int sprintf_s(char (&buf)[N], const char* fmt, Args&&... args) {
              return snprintf(buf, N, fmt, std::forward<Args>(args)...);
          }

          template <typename... Args>
          inline int sprintf_s(char* buf, size_t size, const char* fmt, Args&&... args) {
              return snprintf(buf, size, fmt, std::forward<Args>(args)...);
          }

          template <size_t N>
          inline int strcpy_s(char (&dest)[N], const char* src) {
              strncpy(dest, src, N - 1);
              dest[N - 1] = '\0';
              return 0;
          }

          inline int strcpy_s(char* dest, size_t size, const char* src) {
              if (!dest || size == 0) return -1;
              strncpy(dest, src, size - 1);
              dest[size - 1] = '\0';
              return 0;
          }
          #else
          #ifndef sprintf_s
          #define sprintf_s(buf, ...) snprintf(buf, sizeof(buf), __VA_ARGS__)
          #endif
          #endif

          inline HMODULE LoadLibraryA(const char* name) { (void)name; return NULL; }
          inline HMODULE LoadLibrary(const char* name) { (void)name; return NULL; }
          inline void* GetProcAddress(HMODULE h, const char* sym) { (void)h; (void)sym; return NULL; }
          inline HMODULE GetModuleHandle(const char* name) { (void)name; return NULL; }
          inline HWND GetConsoleWindow() { return NULL; }
          inline int VirtualProtect(void* lpAddress, size_t dwSize, DWORD flNewProtect, DWORD* lpflOldProtect) {
              (void)lpAddress; (void)dwSize; (void)flNewProtect; (void)lpflOldProtect;
              return 1;
          }

          inline DWORD GetFileAttributesA(const char* path) {
              struct stat st;
              if (stat(path, &st) == 0) {
                  if (S_ISDIR(st.st_mode)) return FILE_ATTRIBUTE_DIRECTORY;
                  return 0;
              }
              return INVALID_FILE_ATTRIBUTES;
          }

          inline int MultiByteToWideChar(int a, int b, const char* c, int d, WCHAR* e, int f) {
              (void)a; (void)b; (void)c; (void)d; (void)e; (void)f;
              return 0;
          }

          inline void* DetourGetEntryPoint(HMODULE h) { (void)h; return NULL; }
          inline int DetourTransactionBegin() { return 0; }
          inline int DetourUpdateThread(HANDLE h) { (void)h; return 0; }
          inline int DetourAttach(void** a, void* b) { (void)a; (void)b; return 0; }
          inline int DetourDetach(void** a, void* b) { (void)a; (void)b; return 0; }
          inline int DetourTransactionCommit() { return 0; }

          #endif // !_WIN32

          #endif // WIN_COMPAT_H
          """

          paths_to_save = ["RSDKv5/win_compat.h", "RSDKv5/RSDKv5/win_compat.h"]
          for path in paths_to_save:
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(win_compat_code)

          for root, dirs, files_list in os.walk("RSDKv5"):
              for file in files_list:
                  if file.endswith(('.h', '.hpp', '.cpp', '.c')):
                      filepath = os.path.join(root, file)
                      with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                      if '#define sprintf_s' in content:
                          content = content.replace('#define sprintf_s', '// #define sprintf_s')
                          with open(filepath, 'w', encoding='utf-8') as f:
                              f.write(content)

          for root, dirs, files_list in os.walk("RSDKv5"):
              for file in files_list:
                  if file.endswith(('.h', '.hpp', '.cpp')) and file != 'win_compat.h':
                      filepath = os.path.join(root, file)
                      with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                      if 'win_compat.h' not in content:
                          content = '#include "win_compat.h"\n' + content
                          with open(filepath, 'w', encoding='utf-8') as f:
                              f.write(content)

          detours_path = "RSDKv5/detours.h"
          if os.path.exists(detours_path):
              with open(detours_path, 'r', encoding='utf-8', errors='ignore') as f:
                  d_content = f.read()
              with open(detours_path, 'w', encoding='utf-8') as f:
                  f.write("#ifdef _WIN32\n" + d_content + "\n#endif\n")

          helpers_path = "RSDKv5/Helpers.h"
          if os.path.exists(helpers_path):
              with open(helpers_path, 'r', encoding='utf-8', errors='ignore') as f:
                  h_content = f.read()
              h_content = h_content.replace('#define BASE_ADDRESS', '#undef BASE_ADDRESS\n#define BASE_ADDRESS')
              with open(helpers_path, 'w', encoding='utf-8') as f:
                  f.write(h_content)

          s3k_path = "RSDKv5/S3K.cpp"
          if os.path.exists(s3k_path):
              with open(s3k_path, 'r', encoding='utf-8', errors='ignore') as f:
                  s_content = f.read()
              if 'modPath' in s_content and 'const char *modPath' not in s_content and 'char *modPath' not in s_content:
                  s_content = "#ifndef _WIN32\nstatic const char* modPath = \".\";\n#endif\n" + s_content
              with open(s3k_path, 'w', encoding='utf-8') as f:
                  f.write(s_content)

          win_headers = ['<Shlwapi.h>', '<shlwapi.h>', '<windows.h>', '"detours.h"', '<detours.h>', '<psapi.h>', '<shellapi.h>']
          for root, dirs, files_list in os.walk("RSDKv5"):
              for file in files_list:
                  if file.endswith(('.h', '.hpp', '.cpp')):
                      filepath = os.path.join(root, file)
                      with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                      modified = False
                      lines = content.split('\n')
                      new_lines = []
                      in_win32 = False
                      for line in lines:
                          if '#ifdef _WIN32' in line or '#if defined(_WIN32)' in line:
                              in_win32 = True
                          elif '#endif' in line:
                              in_win32 = False
                          has_win_header = any(h in line for h in win_headers)
                          if has_win_header and not in_win32 and not line.strip().startswith('//'):
                              line = f'#ifdef _WIN32\n{line}\n#endif'
                              modified = True
                          new_lines.append(line)
                      content = '\n'.join(new_lines)
                      if modified:
                          with open(filepath, 'w', encoding='utf-8') as f:
                              f.write(content)

      - name: Configurar estrutura JNI e propriedades do Gradle
        run: |
          cd android/app/jni
          rm -rf RSDKv5
          ln -sf $GITHUB_WORKSPACE RSDKv5

          cd $GITHUB_WORKSPACE/android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/24.0.8215888" >> local.properties

      - name: Compilar APK com Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para download (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv5u-Origins-Debug-APK
          path: android/app/build/outputs/apk/**/*.apk
