name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK & CMake
      run: |
        sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
        
    - name: Configure local.properties
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
        echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> android/local.properties

    # Baixa dependências de áudio (obrigatórias para o CMake compilar o RSDKv5 no Android)
    - name: Download Audio Dependencies
      run: |
        mkdir -p dependencies/android
        git clone https://github.com/xiph/ogg.git dependencies/android/libogg
        git clone https://github.com/xiph/theora.git dependencies/android/libtheora

    - name: Create Engine Symlinks
      run: |
        cd android/app/jni
        # No RSDKv5u-Origins, o jni está 3 níveis abaixo da raiz (app -> android -> raiz)
        ln -s ../../../RSDKv5 RSDKv5
        ln -s ../../../Game Game

    - name: Build with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rsdkv5u-android-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
