name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # CORREÇÃO AQUI: Removemos o passo separado do "sdkmanager" e passamos
    # as dependências direto na action. O "cmdline-tools;latest" substitui o "tools".
    - name: Setup Android SDK, NDK & CMake
      uses: android-actions/setup-android@v3
      with:
        packages: 'cmdline-tools;latest ndk;25.2.9519653 cmake;3.22.1'
        
    - name: Configure local.properties
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > dependencies/android/local.properties
        echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> dependencies/android/local.properties

    - name: Create Engine Symlinks
      run: |
        cd dependencies/android/app/jni
        ln -s ../../../../RSDKv5 RSDKv5
        ln -s ../../../../Game Game

    - name: Build with Gradle
      run: |
        cd dependencies/android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rsdkv5u-android-debug-apk
        path: dependencies/android/app/build/outputs/apk/debug/app-debug.apk
